<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/imgs/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <img src="./assets/imgs/login.png" alt="Imagem | Login">
        <div class="container">
            <a href="index.html" class="link-voltar-home">
                < Voltar para a Home </a>
                    <h2 class="titulo-login">Acesse sua Conta DojoTech</h2>
                    <p class="subtitulo">Entre para acessar o quiz e o painel de evolução.</p>

                    <form id="loginForm">

                        <div class="input-grupo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email_input" name="email" placeholder="seuemail@exemplo.com">
                            <div id="erro_email"></div>
                        </div>

                        <div class="input-grupo">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha_input" name="senha" placeholder="Digite sua senha:">
                            <div id="erro_senha"></div>
                        </div>
                        <button class="btn-login" type="button" onclick="entrar()">Login</button>
                    </form>
                    <p class="link-cadastro">
                        Não possui uma conta? <a href="cadastro.html">Cadastre-se</a>
                    </p>
        </div>
    </main>
</body>

</html>
<script>
    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (email_input.value == '' || !emailVar.includes('@') || !emailVar.includes('.')) {
            erro_email.innerHTML = 'Insira um e-mail válido.';
        }
        if (senha_input.value == '') {
            erro_senha.innerHTML = 'Preencha o campo senha.';
        }
        if (senhaVar.length < 6) {
            erro_senha.innerHTML = 'Insira uma senha válida.';
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;

                    window.location.href = "./simulador.html";
                });
            } else {
                erro_email.innerHTML = "E-mail ou Senha inválidos!";
                erro_senha.innerHTML = "E-mail ou Senha inválidos!";

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })
        return false;
    }
</script>
