<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="../public/assets/imgs/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <main>
        <img src="../public/assets/imgs/login.png" alt="Imagem | Login">
        <div class="container">
            <a href="index.html" class="link-voltar-home">
                < Voltar para a Home 
            </a>
                    <h2 class="titulo-login">Acesse sua Conta DojoTech</h2>
                    <p class="subtitulo">Entre para acessar o quiz e o painel de evolução.</p>

                    <form id="loginForm">

                        <div class="input-grupo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                        </div>

                        <div class="input-grupo">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha:">
                        </div>

                        <div class="input-grupo">
                            <label for="confirmar-senha">Confirmar a Senha</label>
                            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite novamente:">
                        </div>
                        <button class="btn-login">Login</button>
                    </form>
                    <p class="link-cadastro">
                        Não possui uma conta? <a href="../public/cadastro.html">Cadastre-se</a>
                    </p>
        </div>
    </main>
</body>
</html>
