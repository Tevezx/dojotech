<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DojoTech | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="icon" href="./assets/imgs/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header class="cabecalho">
        <div class="cabecalho-esquerda">
            <div class="logo-area">
                DojoTech
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="./dashboard.html" class="link-menu link-ativo">Dashboard</a></li>
                    <li><a href="./quiz.html" class="link-menu">Quiz</a></li>
                    <li><a href="../index.html" class="link-menu">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="dashboard-container">
            <div class="kpi-grid">

                <div id="kpi-pontuacao" class="kpi-card kpi-pontuacao">
                    <p class="kpi-title" onchange="pontos()">Ùltima Pontuação</p>
                    <div class="kpi-value">
                        <span id="valor_pontuacao"></span> <span class="kpi-label">pts</span>
                    </div>
                    <p class="kpi-subtitle">
                        Soma dos pontos no útlimo quiz concluído.
                    </p>
                </div>

                <div id="kpi-perfil" class="kpi-card kpi-perfil">
                    <p class="kpi-title">Perfil Técnico</p>
                    <div class="kpi-value-secondary">
                        <span id="valor_tecnico"></span>
                    </div>
                    <p class="kpi-subtitle">
                        Módulo onde o percentual de acerto é identificado.
                    </p>
                </div>

                <div id="kpi-faixa" class="kpi-card kpi-faixa">
                    <p class="kpi-title">Faixa Atual</p>
                    <div class="kpi-value flex items-center">
                        <span id="valor_faixa"></span>
                    </div>
                    <p id="kpi-subtitle">
                    </p>
                </div>
            </div>

            <div class="ranking-grafico">
                <div class="ranking-container">
                    <h2>🏆 Top 10 DojoTech</h2>
                    <table id="tabela-ranking">
                        <thead>
                            <tr>
                                <th id="posicao_ranking">Posição</th>
                                <th id="nome_ranking">Nome</th>
                                <th id="pontuacao_ranking">Pontuação Total</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>

                <div class="grafico-container">
                    <h2>Histórico</h2>
                    <canvas id="grafico_line"></canvas>
                </div>
                
            </div>

        </div>
    </main>
</body>
<script>
    const usuarioId = sessionStorage.ID_USUARIO;

    function grafico(dados) {
        var labels = [];
        var pontuacoes = [];

        for (let index = 0; index < dados.length; index++) {
            var item = dados[index];

            labels.push(item.data_quiz);
            pontuacoes.push(item.pontuacao);
        }

        const ctx = document.getElementById('grafico_line');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Pontuação por Quiz',
                    data: pontuacoes,
                    borderColor: '#332C2C',
                    backgroundColor: 'rgba(255, 193, 7, 0.2)',
                    tension: 0.4,
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                aspectRatio: 2.2,
                plugins: {
                    title: {
                        display: true,
                        Text: 'Histórico de Pontuaões nos Quizzes',
                        font: {
                            size: 18
                        }
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Pontuação'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Data e Hora do Quiz'
                        }
                    }
                }
            }
        });
    }

    function pontuacaoKpi() {
        fetch(`/dashboard/pontuacao/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirPontuacaoNaKPI(json.pontuacao);
                });
            } else {
                console.error("Erro ao buscar pontuação do KPI.");
                exibirPontuacaoNaKPI(0);
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function exibirPontuacaoNaKPI(pontuacao) {
        const numero = document.getElementById('valor_pontuacao');

        if (numero == null || pontuacao == undefined) {
            valor_pontuacao.innerHTML = `0`
        }

        if (numero) {
            numero.innerHTML = pontuacao;
        } else {
            console.log('Elemento KPI não encontrado!');
        }
    }
    function perfilKpi(perfil) {
        fetch(`/dashboard/perfil/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirPerfil(json.perfil);
                });
            } else {
                console.error("Erro ao buscar pontuação do KPI.");
                exibirPerfil("Sem perfil");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function exibirPerfil(perfil) {
        const maiorperfil = document.getElementById('valor_tecnico');

        if (maiorperfil == undefined || maiorperfil == null) {
            maiorperfil.innerHTML = 'Sem dados de quiz';
        }
        if (perfil) {
            maiorperfil.innerHTML = perfil;
        } else {
            console.log("KPI não encontrado!")
        }
    }
    function faixaKpi(faixa) {
        fetch(`/dashboard/faixa/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirFaixa(json.faixa);
                });
            } else {
                console.error("Erro ao buscar a faixa.");
                exibirFaixa("Branca");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function exibirFaixa(faixa) {
        const valorFaixa = document.getElementById('valor_faixa');
        const kpiFaixa = document.getElementById('kpi-faixa');
        const proximaFaixa = document.getElementById('kpi-subtitle');

        if (faixa == "Branca") {
            kpiFaixa.style.borderTopColor = 'white';
            proximaFaixa.innerHTML = "Próxima faixa: Amarela";
        } else if (faixa == "Amarela") {
            kpiFaixa.style.borderTopColor = 'yellow';
            proximaFaixa.innerHTML = "Próxima faixa: Azul";
        } else if (faixa == "Azul") {
            kpiFaixa.style.borderTopColor = 'blue';
            proximaFaixa.innerHTML = "Próxima faixa: Vermelha";
        } else if (faixa == "Vermelha") {
            kpiFaixa.style.borderTopColor = 'red';
            proximaFaixa.innerHTML = "Próxima faixa: Preta";
        } else if (faixa == "Preta") {
            kpiFaixa.style.borderTopColor = 'black';
            proximaFaixa.innerHTML = "";
        } else {
            kpiFaixa.style.borderTopColor = 'white';
            proximaFaixa.innerHTML = "Próxima faixa Amarela";
        }



        if (valorFaixa == undefined || valorFaixa == null) {
            valorFaixa.innerHTML = 'Sem dados de quiz';
        }
        if (valorFaixa) {
            valorFaixa.innerHTML = faixa;
        } else {
            console.log("KPI não encontrado!")
        }
    }

    function historicoKpi() {
        fetch(`/dashboard/historico/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    grafico(json);
                });
            } else {
                console.error("Erro ao buscar o historico.");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function ranking() {
        fetch(`/dashboard/ranking/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirRanking(json);
                });
            } else {
                console.error("Erro ao buscar o historico.");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }

    function exibirRanking(ranking) {
        const tabelaRanking = document.getElementById('tabela-ranking');

        if (ranking && ranking.length > 0) {
            for (let i = 0; i < ranking.length; i++) {
                const item = ranking[i];

                tabelaRanking.innerHTML += `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${item.nome}</td> 
                            <td>${item.pontuacao_total}</td> 
                        </tr>
                    `;
            }
        } else {
            tabelaRanking.innerHTML = '<tr><td>Nenhum dado de ranking encontrado.</td></tr>';
        }

    }

    function dashboard() {
        pontuacaoKpi();
        perfilKpi();
        faixaKpi();
        historicoKpi();
        ranking()
    }

    window.onload = dashboard;

</script>

</html>
