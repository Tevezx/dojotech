<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DojoTech | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="icon" href="./assets/imgs/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header class="cabecalho">
        <div class="cabecalho-esquerda">
            <div class="logo-area">
                DojoTech
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="./dashboard.html" class="link-menu link-ativo">Dashboard</a></li>
                    <li><a href="./quiz.html" class="link-menu">Quiz</a></li>
                    <li><a href="../index.html" class="link-menu">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="dashboard-container">
            <div class="kpi-grid">

                <div id="kpi-pontuacao" class="kpi-card kpi-pontuacao">
                    <p class="kpi-title" onchange="pontos()">Pontuação Total</p>
                    <div class="kpi-value">
                        <span id="valor_pontuacao"></span> <span class="kpi-label">pts</span>
                    </div>
                    <p class="kpi-subtitle">
                        Soma dos pontos em todos os quizzes concluídos.
                    </p>
                </div>

                <div id="kpi-fraqueza" class="kpi-card kpi-fraqueza">
                    <p class="kpi-title">Maior Fraqueza</p>
                    <div class="kpi-value-secondary">
                        <span id="valor_fraqueza"></span>
                    </div>
                    <p class="kpi-subtitle">
                        Módulo onde o percentual de acerto é mais baixo (45%).
                    </p>
                </div>

                <div id="kpi-faixa" class="kpi-card kpi-faixa">
                    <p class="kpi-title">Faixa Atual</p>
                    <div class="kpi-value flex items-center">
                        <span id="valor_faixa"></span>
                    </div>
                    <p class="kpi-subtitle">
                        Próximo objetivo: Faixa Vermelha.
                    </p>
                </div>

            </div>
            <div>
                <canvas id="grafico_line"></canvas>
            </div>
        </div>
    </main>
</body>
<script>
    const usuarioId = sessionStorage.ID_USUARIO;

    function grafico(dados) {
        var labels = [];
        var pontuacoes = [];

        for (let index = 0; index < dados.length; index++) {
            var item = dados[index];
            
            labels.push(item.data_quiz);
            pontuacoes.push(item.pontuacao);
        }

        const ctx = document.getElementById('grafico_line');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Pontuação por Quiz',
                    data: pontuacoes,
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    function pontuacaoKpi() {
        fetch(`/dashboard/pontuacao/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirPontuacaoNaKPI(json.pontuacao);
                });
            } else {
                console.error("Erro ao buscar pontuação do KPI.");
                exibirPontuacaoNaKPI(0);
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function exibirPontuacaoNaKPI(pontuacao) {
        const numero = document.getElementById('valor_pontuacao');

        if (numero == null || pontuacao == undefined) {
            valor_pontuacao.innerHTML = `0`
        }

        if (numero) {
            numero.innerHTML = pontuacao;
        } else {
            console.log('Elemento KPI não encontrado!');
        }
    }
    function fraquezaKpi(fraqueza) {
        fetch(`/dashboard/fraqueza/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirFraqueza(json.fraqueza);
                });
            } else {
                console.error("Erro ao buscar pontuação do KPI.");
                exibirFraqueza("Sem fraqueza");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function exibirFraqueza(fraqueza) {
        const maiorFraqueza = document.getElementById('valor_fraqueza');

        if (maiorFraqueza == undefined || maiorFraqueza == null) {
            maiorFraqueza.innerHTML = 'Sem dados de quiz';
        }
        if (fraqueza) {
            maiorFraqueza.innerHTML = fraqueza;
        } else {
            console.log("KPI não encontrado!")
        }
    }
    function faixaKpi(faixa) {
        fetch(`/dashboard/faixa/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    exibirFaixa(json.faixa);
                });
            } else {
                console.error("Erro ao buscar a faixa.");
                exibirFaixa("Branca");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }
    function exibirFaixa(faixa) {
        const valorFaixa = document.getElementById('valor_faixa');

        if (valorFaixa == undefined || valorFaixa == null) {
            valorFaixa.innerHTML = 'Sem dados de quiz';
        }
        if (valorFaixa) {
            valorFaixa.innerHTML = faixa;
        } else {
            console.log("KPI não encontrado!")
        }
    }

    function historicoKpi() {
        fetch(`/dashboard/historico/${usuarioId}`, {
            method: "GET"
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    console.log(json);
                    grafico(json);
                });
            } else {
                console.error("Erro ao buscar o historico.");
            }
        }).catch(function (erro) {
            console.log(erro);
        });
    }

    function dashboard() {
        pontuacaoKpi();
        fraquezaKpi();
        faixaKpi();
        historicoKpi();
    }

    window.onload = dashboard;

</script>

</html>
