<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DojoTech | Quiz</title>

    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="icon" href="../assets/imgs/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="cabecalho">
        <div class="cabecalho-esquerda">
            <div class="logo-area">
                DojoTech
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="./dashboard.html" class="link-menu">Dashboard</a></li>
                    <li><a href="./quiz.html" class="link-menu link-ativo">Quiz</a></li>
                    <li><a href="../index.html" class="link-menu">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="quiz-container" style="display: block;">
            <div id="inicio-quiz">
                <h1>Avaliação de Perfil Técnico em Hapkido</h1>
                <p>Responda com a opção que melhor reflete sua
                    preferência
                    instintiva em combate. O resultado indicará suas áreas de força e fraqueza no Hapkido.</p>

                <div id="quiz-inicio" style="text-align: center; margin-top: 40px;">
                    <button id="inicio-quiz-btn" type="button" onclick="iniciar()">Iniciar Avaliação de Perfil</button>
                </div>
            </div>

            <form id="hapkidoquiz" style="display: block;">

                <div class="questao-none" id="questao" style="display: none;">
                    <p class="questao-numero"></p>
                    <p class="questao-text"></p>
                    <div class="opcao">
                        <span>
                            <input type="radio" id="primeiraOpcao" name="hapkido_option" class="radio"
                                value="alternativaA" />
                            <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                        </span>
                        <span>
                            <input type="radio" id="segundaOpcao" name="hapkido_option" class="radio"
                                value="alternativaB" />
                            <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                        </span>
                        <span>
                            <input type="radio" id="terceiraOpcao" name="hapkido_option" class="radio"
                                value="alternativaC" />
                            <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                        </span>
                        <span>
                            <input type="radio" id="quartaOpcao" name="hapkido_option" class="radio"
                                value="alternativaD" />
                            <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                        </span>
                    </div>
                </div>

                <div class="botao-area">
                    <button onclick="avancar()" id="btnProx" style="display: none;">Avançar</button>
                    <button type="button" id="botao_quiz" style="display: none;" onclick="publicar()">Finalizar</button>
                    <button type="button" id="botao_novamente" style="display: none;" onclick="tentarNovamente()">Tentar
                        Novamente</button>
                    <div id="resultado_mensagem" style="display: none;"></div>
                    <span id="spanCertas" style="color: green; padding: 10px 10px 10px 10px"></span>    <span id="spanErradas" style="color: red;"></span>
                    <button type="button" id="botao_visualizar" style="display: none;"
                        onclick="irParaDashboard()">Visualizar dashboard</button>
                </div>

            </form>
        </div>
    </main>
</body>
<script>

    var usuario = sessionStorage.NOME_USUARIO;
    var usuarioId = sessionStorage.ID_USUARIO;

    const listaDeQuestoes = [
        {
            pergunta: "Em uma luta, qual ferramenta você usaria primeiro para manter o oponente afastado?",
            alternativaA: "Chutes de longo alcance",
            alternativaB: "Soco e bloqueio para criar distância",
            alternativaC: "Agarramento para controle e queda",
            alternativaD: "Mover-se para evitar e buscar um takedown",
            alternativaCorreta: "alternativaA"
        },

        {
            pergunta: "Se for agarrado por trás, qual sua reação primária?",
            alternativaA: "Realizar uma queda ou projeção",
            alternativaB: "Usar um stomp ou chute lateral",
            alternativaC: "Aplicar uma chave de articulação ou ponto de pressão",
            alternativaD: "Golpear ou usar cotoveladas para liberar a pegada",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Qual tipo de treino você considera mais crucial para sua evolução no Hapkido?",
            alternativaA: "Treino de solo e controle de imobilização",
            alternativaB: "Treino de esquivas e timing de golpe",
            alternativaC: "Treino de flexibilidade e chutes acrobáticos",
            alternativaD: "Treino de quedas e rolamentos seguros",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "O oponente avança com força total. Sua primeira prioridade é:",
            alternativaA: "Entrar na linha de ataque para derrubá-lo",
            alternativaB: "Interceptar o avanço com um chute frontal",
            alternativaC: "Usar a força dele contra ele com uma técnica de articulação",
            alternativaD: "Golpear para interromper o avanço e criar uma abertura",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Qual elemento do Hapkido você mais admira em um mestre?",
            alternativaA: "A capacidade de derrubar um adversário com mínimo esforço",
            alternativaB: "A precisão e potência dos golpes de mão",
            alternativaC: "O domínio e a aplicação de chaves de pulso e cotovelo",
            alternativaD: "A variedade e a altura dos chutes",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Lidando com múltiplos atacantes, qual tática você priorizaria?",
            alternativaA: "Manter a distância usando chutes para afastar",
            alternativaB: "Mover-se constantemente, usando quedas para desorganizar o grupo",
            alternativaC: "Usar combinações rápidas de soco e cotovelo",
            alternativaD: "Controlar o primeiro atacante para usá-lo como escudo",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Qual é a sua distância de combate mais confortável?",
            alternativaA: "Longo alcance, usando a perna",
            alternativaB: "Médio alcance, para golpes de mão e corpo-a-corpo",
            alternativaC: "Curto alcance, corpo-a-corpo, para chaves e estrangulamentos",
            alternativaD: "Distância de entrada e saída rápida para projeções",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Quando o oponente está em desvantagem, como você finaliza a técnica?",
            alternativaA: "Com um golpe finalizador no corpo ou cabeça",
            alternativaB: "Com uma queda forte no chão",
            alternativaC: "Com uma imobilização ou chave de finalização",
            alternativaD: "Com uma sequência de chutes rápidos",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Se o oponente está com uma faca, qual princípio você aplicaria primeiro?",
            alternativaA: "Desarmar com uma chave de pulso complexa",
            alternativaB: "Chutar o braço/mão que segura a arma",
            alternativaC: "Evitar o ataque e usar o momentum para uma queda",
            alternativaD: "Golpear rapidamente para atordoar e desarmar",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Qual atributo é a sua maior arma em um confronto real?",
            alternativaA: "Minha capacidade de adaptar-me à força do agressor",
            alternativaB: "Minha agilidade e poder de chute",
            alternativaC: "Minha velocidade e precisão de soco",
            alternativaD: "Meu equilíbrio e capacidade de projetar o oponente",
            alternativaCorreta: "alternativaD"
        },
    ]

    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length

    function iniciar() {
        document.getElementById('inicio-quiz').style.display = "none"
        document.getElementById('questao').style.display = "block"
        document.getElementById('btnProx').style.display = "block"

        preencherHTMLcomQuestaoAtual(0)

        document.getElementById('botao_quiz').style.display = "none"
        document.getElementById('botao_novamente').style.display = "none"
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index

        document.querySelector(".questao-numero").innerHTML = `Questão ${Number(index) + 1} de ${quantidadeDeQuestoes}`;
        document.querySelector(".questao-text").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
    }

    function publicar() {
        const options = document.getElementsByName("hapkido_option");
        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
            return
        }

        document.getElementById('btnProx').disabled = true

        fetch(`/quiz/publicar`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ usuarioIdServer: usuarioId, pontuacaoFinalServer: pontuacaoFinal }),
        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {
                console.log("Post realizado com sucesso pelo usuario de ID: " + usuario + "!");
                finalizarJogo()
            } else if (resposta.status == 404) {
                console.log("Deu 404!");
                finalizarJogo()
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            finalizarJogo();
        });
        return false;
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        document.getElementById('primeiraOpcao').disabled = opcaoEscolhida
        document.getElementById('segundaOpcao').disabled = opcaoEscolhida
        document.getElementById('terceiraOpcao').disabled = opcaoEscolhida
        document.getElementById('quartaOpcao').disabled = opcaoEscolhida
    }

    function avancar() {
        const options = document.getElementsByName("hapkido_option");
        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }
        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
            return false
        }
        checarResposta()

        habilitarAlternativas(false)
        document.getElementById('btnProx').disabled = true

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {

            setTimeout(() => {
                limparCoresBackgroundOpcoes()
                desmarcarRadioButtons()
                preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
                document.getElementById('btnProx').disabled = false
            }, 1000);
        } else {
            document.getElementById('btnProx').style.display = "none"
            document.getElementById('botao_quiz').style.display = "block"
            document.getElementById('botao_quiz').disabled = false

            document.getElementById('botao_quiz').onclick = publicar;
        }
    }

    function tentarNovamente() {
        window.location.reload()
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual]
        const respostaQuestaoAtual = questaoAtual.alternativaCorreta

        const options = document.getElementsByName("hapkido_option");

        let alternativaCorreta = null

        options.forEach((option) => {
            if (option.value === respostaQuestaoAtual) {
                alternativaCorreta = option.labels[0].id
            }
        })

        options.forEach((option) => {
            if (option.checked === true && option.value === respostaQuestaoAtual) {

                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                pontuacaoFinal++
                certas++
                document.getElementById("spanCertas").innerHTML = `Questões certas: ${certas}`
                numeroDaQuestaoAtual++
            } else if (option.checked && option.value !== respostaQuestaoAtual) {
                const wrongLabelId = option.labels[0].id

                document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                tentativaIncorreta++
                erradas++
                document.getElementById("spanErradas").innerHTML = `Questões erradas: ${erradas}`
                numeroDaQuestaoAtual++
            }
        })
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("hapkido_option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("hapkido_option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {
        var textoFaixa = null;
        var textoParaMensagemFinal = null
        var porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes

        if (porcentagemFinalDeAcertos <= 0.39) {
            textoParaMensagemFinal = "Conhecimento Básico"
        }
        else if (porcentagemFinalDeAcertos > 0.39 && porcentagemFinalDeAcertos <= 0.59) {
            textoParaMensagemFinal = "Conhecimento Funcional"
        }
        else if (porcentagemFinalDeAcertos > 0.59 && porcentagemFinalDeAcertos <= 0.79) {
            textoParaMensagemFinal = "Conhecimento Robusto"
        }
        else {
            textoParaMensagemFinal = "Domínio Comprovado"
        }

        if (certas >= 0 && certas <= 3) {
            textoFaixa = "Branca"
        } else if (certas > 3 && certas <= 5) {
            textoFaixa = "Amarela"
        } else if (certas > 5 && certas <= 7) {
            textoFaixa = "Azul"
        } else if (certas > 7 && certas <= 9) {
            textoFaixa = "Vermelha"
        } else {
            textoFaixa = "Preta"
        }

        fetch(`/quiz/finalizarJogo`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ usuarioIdServer: usuarioId, textoParaMensagemFinalServer: textoParaMensagemFinal }),
        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {
                console.log("Mensagem salva com sucesso!")
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });

        fetch(`/quiz/faixa`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ usuarioIdServer: usuarioId, textoFaixaServer: textoFaixa }),
        }).then(function (resposta) {

            console.log("resposta: ", resposta);

            if (resposta.ok) {
                console.log("Mensagem salva com sucesso!")
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });

        mensagemFinal = `Com base em suas respostas: ` + Math.round((porcentagemFinalDeAcertos) * 100) + "% das questões, motivaram sua caracteristica! Clique em <b>Visualizar Dashboard e saiba mais!</b>";

        document.getElementById('resultado_mensagem').style.display = "block"
        document.getElementById('resultado_mensagem').innerHTML = mensagemFinal

        document.getElementById('spanCertas').innerHTML = `Certas: ${certas}`
        document.getElementById('spanErradas').innerHTML = `Erradas: ${erradas}`

        document.getElementById('questao').style.display = "none";
        document.getElementById('botao_quiz').style.display = "none";
        document.getElementById('botao_novamente').style.display = "block";
        document.getElementById('botao_visualizar').style.display = "block";


    }

    function irParaDashboard() {
        window.location.href = "./dashboard.html";
    }
</script>

</html>
