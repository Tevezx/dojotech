<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DojoTech | Cadastro</title>

    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" href="./assets/imgs/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <img src="./assets/imgs/cadastro.png" alt="Imagem | Cadastro">
        <div class="container">
            <a href="index.html" class="link-voltar-home">
                < Voltar para a Home </a>
                    <h2 class="titulo-cadastro">Crie sua Conta DojoTech</h2>
                    <p class="subtitulo">Cadastre-se para acessar o quiz e o painel de evolução.</p>

                    <form id="cadastroForm">
                        <div class="input-grupo">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome_input" name="nome" placeholder="Digite seu nome:">
                            <div id="erro_nome"></div>
                        </div>

                        <div class="input-grupo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email_input" name="email" placeholder="seuemail@exemplo.com">
                            <div id="erro_email"></div>
                        </div>

                        <div class="input-grupo">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha_input" name="senha" placeholder="Digite sua senha:">
                            <div id="erro_senha"></div>
                        </div>

                        <div class="input-grupo">
                            <label for="confirmar-senha">Confirmar a Senha</label>
                            <input type="password" id="confirmacao_senha_input" name="confirmar-senha" placeholder="Digite novamente:">
                            <div id="erro_confirmarSenha"></div>
                        </div>
                        <button class="btn-cadastrar" type="button" onclick="cadastrar()">Cadastrar</button>
                    </form>
                    <p class="link-login">
                        Já tem uma conta? <a href="login.html">Faça Login</a>
                    </p>
        </div>
        <div id="mensagem_sucesso">
          <p>Cadastro Realizado!</p>
          <button><a href="login.html">Entrar</a></button>
        </div>
    </main>
</body>
<script>
  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      erro_nome.innerHTML = "Preencha o campo nome!";
      erro_email.innerHTML = "Preencha o campo e-mail!";
      erro_senha.innerHTML = "Preencha o campo senha!";
      erro_confirmarSenha.innerHTML = "Preencha o campo confirmar senha!";
    } else {
      setInterval(5000);
    }

    if(nomeVar.length < 1){
      erro_nome.innerHTML = "Nome menor que 1 caractere"
      return false;
    }if(!emailVar.includes('@')){
      erro_email.innerHTML = "Email deve conter @"
      return false;
    }if(senhaVar.length < 8){
      erro_senha.innerHTML = "Senha deve ter no mínimo 8 caracteres"
      return false;
    }if(senhaVar != confirmacaoSenhaVar){
      erro_confirmarSenha.innerHTML = "As senhas precisam ser iguais"
      return false;
    }
    else{
      setInterval(5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          mensagem_sucesso.style.display = "block";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
    }
</script>
</html>
